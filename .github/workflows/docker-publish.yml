name: Build and Publish Container Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      install_kodi:
        description: "Include Kodi packages in the image"
        type: boolean
        default: false
      arm64:
        description: "Also build and push linux/arm64 (slow: built under QEMU emulation)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, audit and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: Install tmux (used by the automation runner tests)
        run: command -v tmux || (sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends tmux)

      - name: Syntax check (backend + frontend)
        run: for f in *.js automations/*.js public/js/*.js test/*.js; do node --check "$f"; done

      - name: Lint
        run: npm run lint

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests
        run: npm test

  image:
    name: Build, smoke-test and publish image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      BUILD_ARGS: |
        INSTALL_KODI=${{ inputs.install_kodi || false }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU (arm64 builds only)
        if: inputs.arm64
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build for the runner's platform and load it into Docker so it can be started and checked.
      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: agent-hub:ci
          build-args: ${{ env.BUILD_ARGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (start, health, sign-in, UI, preview port, CLIs)
        run: scripts/smoke-test.sh agent-hub:ci

      # Report-only: the image bundles a full Debian + Chromium toolchain, so this surfaces fixable
      # HIGH/CRITICAL CVEs without blocking releases. App dependencies are gated by `npm audit` above.
      - name: Scan image for vulnerabilities (report only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agent-hub:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          format: table
          exit-code: "0"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags and labels
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      # Same build as above (served from the cache), pushed only after the smoke test passed.
      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.arm64 && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ env.BUILD_ARGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
